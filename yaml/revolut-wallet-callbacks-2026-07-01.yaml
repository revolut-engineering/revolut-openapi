                                    alignment: full
                boarding_pass_pkpass_base64:
                  summary: A boarding pass produced by the transaction (pkpass, base64)
                  value:
                    passes:
                      - format: pkpass_base64
                        partner_reference: skyjet-2241-R7K92M
                        version: 1
                        template_id: tmpl_skyjet_boarding
                        pkpass: UEsDBAoAAAAAAGhVmVQAAAAAAAAAAAAAAAAJAAAA...
                loyalty_pass_walletobjects_json:
                  summary: A loyalty pass produced by the transaction (Wallet Objects JSON)
                  value:
                    passes:
                      - format: walletobjects_json
                        partner_reference: brightpoints-9988776655
                        version: 1
                        template_id: tmpl_brightpoints_loyalty
                        walletobjects:
                          type: loyalty
                          class:
                            id: 1234567890123456789.brightpoints_loyalty
                            issuerName: BrightPoints
                            programName: BrightPoints Rewards
                            programLogo:
                              sourceUri:
                                uri: https://example.com/brightpoints-logo.png
                            reviewStatus: APPROVED
                          object:
                            id: 1234567890123456789.member_9988776655
                            classId: 1234567890123456789.brightpoints_loyalty
                            state: ACTIVE
                            barcode:
                              type: QR_CODE
                              value: '9988776655'
                            accountName: Alan Maxwell
                            accountId: '9988776655'
                mixed_formats:
                  summary: Multiple passes in different formats from the same transaction
                  value:
                    passes:
                      - format: revpass
                        partner_reference: skyjet-2241-R7K92M
                        version: 1
                        template_id: tmpl_skyjet_boarding
                        rev_pass:
                          type: boarding_pass
                          relevant_at: '2026-08-02T06:15:00.000Z'
                          semantics:
                            passenger:
                              full_name: Ada Shannon
                            flight:
                              flight_number: '2241'
                              carrier_code: SJ
                              departure_airport:
                                iata: LTN
                              arrival_airport:
                                iata: OTP
                              scheduled_departure_at: '2026-08-02T06:15:00.000Z'
                              scheduled_arrival_at: '2026-08-02T09:40:00.000Z'
                            boarding:
                              gate: B22
                            booking:
                              pnr: R7K92M
                      - format: pkpass_url
                        partner_reference: skyjet-lounge-2241
                        version: 1
                        pkpass_url: https://partner.example/passes/lounge-2241.pkpass
                digital_receipt:
                  summary: A tax-inclusive digital receipt with a tip produced by the transaction
                  value:
                    passes: []
                    split_tender: false
                    digital_receipts:
