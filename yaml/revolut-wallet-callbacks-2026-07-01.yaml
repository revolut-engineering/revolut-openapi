openapi: 3.1.0
info:
  title: '[PREVIEW] Revolut Wallet Partner Callbacks'
  version: '2026-07-01'
  description: |
    :::warning[Pre-release preview]
    This is a pre-release preview of upcoming documentation.
    The features, workflows, and UI described here are subject to change before the final release.
    :::

    Endpoints you host and Revolut calls. Implement them to this contract so we can pull data
    on demand. Revolut is always the client; you are the server.

    - **Fetch transaction outcomes**: `POST /transaction-outcomes/search`. Called after a customer pays
      with a Revolut card, we ask what `passes` that transaction produced.
    - **Fetch a pass update**: `GET /passes/{partner_reference}`. We poll for the current state of
      a pass so we can refresh it in the customer's wallet.

    Passes are identified by **your own** `partner_reference`, which is the value you set when you return a
    pass here, and that Revolut echoes back when it calls the companion Revolut-hosted API
    (`/docs/api/revolut-wallet-partner`).

    The base URL in `servers` is illustrative; you register your real base URL during onboarding.

    :::info
    Start with the [Revolut Wallet guide](https://developer.revolut.com/docs/guides/revolut-wallet/introduction) and [Get started](https://developer.revolut.com/docs/guides/revolut-wallet/get-started) to onboard your business.
    :::
  contact:
    name: Revolut Wallet partner onboarding
    email: revwallet-partner-onboarding@revolut.com
servers:
  - url: https://passes.partner.example/revolut-wallet
    description: Your registered base URL (example)
security:
  - mtls: []
  - mtls: []
    jws: []
  - jws: []
  - oauth2:
      - passes.read
  - oauth2:
      - passes.read
    mtls: []
tags:
  - name: '[PREVIEW] Transaction outcomes'
    description: |
      Return what a Revolut-card transaction produced.

      :::warning[Pre-release preview]
      This is a pre-release preview of upcoming documentation.
      The features, workflows, and UI described here are subject to change before the final release.
      :::
  - name: '[PREVIEW] Passes'
    description: |
      Return the current state of a pass on request.

      :::warning[Pre-release preview]
      This is a pre-release preview of upcoming documentation.
      The features, workflows, and UI described here are subject to change before the final release.
      :::
paths:
  /transaction-outcomes/search:
    post:
      tags:
        - '[PREVIEW] Transaction outcomes'
      operationId: searchTransactionOutcomes
      summary: '[PREVIEW] Fetch transaction outcomes for a transaction'
      description: |
        :::warning[Pre-release preview]
        This is a pre-release preview of upcoming documentation.
        The features, workflows, and UI described here are subject to change before the final release.
        :::

        Revolut calls this after detecting a Revolut-card transaction at your business. Match the
        transaction from the `transaction_context` and return what it produced.

        Despite using `POST`, this is a **safe lookup** with no side effects: `POST` is used only to
        carry the match criteria in the body (keeping `rrn` out of URLs/logs and allowing the key to
        grow). No `Idempotency-Key` is required.

        **Status semantics (these drive our retry behaviour):**
        - `200`: transaction matched; return the outcomes (the `passes` array may be empty).
        - `202`: transaction not ready yet (settlement lag); we retry, honouring `Retry-After`.
        - `404`: transaction definitively not found; we stop retrying.
        - `410`: transaction existed but its outcome is void (refund/cancellation); we stop.
        - `429` / `503`: temporary capacity issue; we retry, honouring `Retry-After`.

        :::note
        Validate Revolut's credentials (mTLS, JWS, or OAuth 2.0) and reject any unauthenticated request with `401`.
        :::

        :::info
        See [Auto-provision transaction results](https://developer.revolut.com/docs/guides/revolut-wallet/operations/transaction-results) for matching logic and examples.
        :::
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionOutcomesSearchRequest'
            examples:
              lookup:
                value:
                  transaction_context:
                    rrn: '123456789012'
                    merchant_id: mer_example_01
                    transaction_at: '2026-07-01T12:00:00.000Z'
                    total:
                      amount: '72.40'
                      currency: GBP
      responses:
        '200':
          description: Transaction matched. Returns the outcomes it produced.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionOutcomes'
              examples:
                boarding_pass:
                  summary: A single boarding pass produced by the transaction
                  value:
                    passes:
                      - partner_reference: skyjet-2241-R7K92M
                        type: boarding_pass
                        version: 1
                        template_id: tmpl_skyjet_boarding
                        relevant_at: '2026-08-02T06:15:00.000Z'
                        semantics:
                          passenger:
                            full_name: Sarah Connor
                          flight:
                            flight_number: '2241'
                            carrier_code: SJ
                            departure_airport:
                              iata: LTN
                              terminal: '1'
                            arrival_airport:
                              iata: OTP
                            scheduled_departure_at: '2026-08-02T06:15:00.000Z'
                            scheduled_arrival_at: '2026-08-02T09:40:00.000Z'
                          boarding:
                            gate: B22
                            seat: 14C
                          booking:
                            pnr: R7K92M
                generic_pass:
                  summary: A generic pass with a positional presentation
                  value:
                    passes:
                      - partner_reference: acme-events-badge-0001
                        type: generic_pass
                        version: 1
                        template_id: tmpl_acme_events_generic
                        fields:
                          - id: attendee_name
                            label:
                              default: Attendee
                            value:
                              default: Sarah Connor
                            data_category: identity
                            semantic_type: participant.full_name
                            importance: 5
                          - id: access_status
                            label:
                              default: Access
                            value:
                              default: VIP access
                            data_category: status
                            importance: 4
                          - id: ticket_number
                            label:
                              default: Ticket number
                            value:
                              default: AM2026-0001
                            data_category: verification
                            importance: 4
                          - id: event_starts_at
                            label:
                              default: Starts at
                            value:
                              default: '2026-09-15T19:00:00.000Z'
                            data_type: date_time
                            data_category: time
                            date_style: medium
                            time_style: short
                            importance: 3
                          - id: terms_conditions
                            label:
                              default: Terms and conditions
                            value:
                              default: Entry is subject to the event terms and conditions.
                            data_category: governance
                            importance: 1
                        presentation:
                          positional:
                            primary:
                              items:
                                - field_id: attendee_name
                                  alignment: full
                            secondary:
                              - items:
                                  - field_id: access_status
                                    alignment: start
                                  - field_id: ticket_number
                                    alignment: end
                            footer:
                              items:
                                - field_id: event_starts_at
                                  alignment: start
                                - field_id: terms_conditions
                                  alignment: end
                generic_pass_semantic_fallback:
                  summary: A generic pass using semantic fallback
                  value:
                    passes:
                      - partner_reference: acme-events-semantic-0001
                        type: generic_pass
                        version: 1
                        template_id: tmpl_acme_events_semantic
                        fields:
                          - id: attendee_name
                            label:
                              default: Attendee
                            value:
                              default: Sarah Connor
                            data_category: identity
                            semantic_type: participant.full_name
                            importance: 5
                          - id: ticket_number
                            label:
                              default: Ticket number
                            value:
                              default: AM2026-0001
                            data_category: verification
                            semantic_type: ticket.number
                            importance: 4
                          - id: event_starts_at
                            label:
                              default: Starts at
                            value:
                              default: '2026-09-15T19:00:00.000Z'
                            data_type: date_time
                            data_category: time
                            semantic_type: event.starts_at
                generic_pass_header:
                  summary: A generic pass with a header row
                  value:
                    passes:
                      - partner_reference: acme-events-header-0001
                        type: generic_pass
                        version: 1
                        template_id: tmpl_acme_events_generic
                        fields:
                          - id: event_title
                            label:
                              default: Event
                            value:
                              default: Acme Future Festival
                            data_category: identity
                            semantic_type: event.name
                            importance: 5
                          - id: attendee_name
                            label:
                              default: Attendee
                            value:
                              default: Sarah Connor
                            data_category: identity
                            semantic_type: participant.full_name
                          - id: ticket_number
                            label:
                              default: Ticket number
                            value:
                              default: AM2026-0001
                            data_category: verification
                            semantic_type: ticket.number
                          - id: event_starts_at
                            label:
                              default: Starts at
                            value:
                              default: '2026-09-15T19:00:00.000Z'
                            data_type: date_time
                            data_category: time
                            semantic_type: event.starts_at
                        presentation:
                          positional:
                            header:
                              items:
                                - field_id: event_title
                                  alignment: full
                            primary:
                              items:
                                - field_id: attendee_name
                                  alignment: full
                            secondary:
                              - items:
                                  - field_id: ticket_number
                                    alignment: full
                            footer:
                              items:
                                - field_id: event_starts_at
                                  alignment: full
                none:
                  summary: Transaction matched, but produced no passes
                  value:
                    passes: []
        '202':
          description: |
            Transaction accepted but its outcome is not ready yet (settlement lag). Revolut retries,
            honouring `Retry-After`.

            :::note
            Return no body with `202`.
            :::
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Transaction definitively not found. Revolut will stop retrying.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                transaction_not_found:
                  value:
                    code: transaction_not_found
                    message: No transaction found for this rrn and merchant_id.
        '410':
          description: Transaction outcome is void (refund/cancellation). Revolut will stop retrying.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                transaction_void:
                  value:
                    code: transaction_void
                    message: The transaction outcome is void due to a refund or cancellation.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /passes/{partner_reference}:
    get:
      tags:
        - '[PREVIEW] Passes'
      operationId: fetchPass
      summary: '[PREVIEW] Retrieve a pass'
      description: |
        :::warning[Pre-release preview]
        This is a pre-release preview of upcoming documentation.
        The features, workflows, and UI described here are subject to change before the final release.
        :::

        Return the latest state of the pass identified by `partner_reference` (the reference you
        assigned). Revolut calls this on a schedule and on demand to refresh what the customer sees.

        **Support conditional requests.** You generate and return an `ETag` header with every `200`
        response. It is an opaque token representing the current state of the pass. Revolut stores
        it and sends it back as `If-None-Match` on subsequent calls. If the pass is unchanged since
        that `ETag`, reply `304 Not Modified` (no body). If it has changed, return `200` with the
        full pass and a fresh `ETag`.

        **Status semantics:**
        - `200`: pass returned.
        - `304`: unchanged since the supplied `ETag`.
        - `404` / `410`: pass gone. Revolut stops polling it.

        :::note
        Validate Revolut's credentials (mTLS, JWS, or OAuth 2.0) and reject any unauthenticated request with `401`.
        :::

        :::info
        See [Update a pass](https://developer.revolut.com/docs/guides/revolut-wallet/operations/update-pass) for the push-vs-poll model and polling cadence.
        :::
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - name: partner_reference
          in: path
          required: true
          description: |
            Your own reference for the pass, as set when you created it (Partner API `POST /passes`)
            or returned in a transaction-outcomes response. Send the **bare value** here — do not use
            the `ref:` prefix (that form is only for the Partner API `PUT /passes/{id}`).
          schema:
            type: string
            maxLength: 128
          example: skyjet-2241-R7K92M
        - name: If-None-Match
          in: header
          required: false
          description: |
            An `ETag` previously returned by your `200` response to this endpoint. Revolut sends it
            back so you can skip re-sending an unchanged pass. Return `304 Not Modified` if the
            pass state is the same as when you issued this `ETag`.
          schema:
            type: string
          example: '"v3"'
      responses:
        '200':
          description: |
            Current pass state. Excludes `template_id` (immutable, set at creation).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassUpdate'
              examples:
                boarding_pass:
                  summary: A boarding pass with updated gate
                  value:
                    partner_reference: skyjet-2241-R7K92M
                    type: boarding_pass
                    version: 4
                    relevant_at: '2026-08-02T06:15:00.000Z'
                    semantics:
                      passenger:
                        full_name: Sarah Connor
                      flight:
                        flight_number: '2241'
                        carrier_code: SJ
                        departure_airport:
                          iata: LTN
                        arrival_airport:
                          iata: OTP
                        scheduled_departure_at: '2026-08-02T06:15:00.000Z'
                        scheduled_arrival_at: '2026-08-02T09:40:00.000Z'
                      boarding:
                        gate: C14
                        seat: 14C
                      booking:
                        pnr: R7K92M
                generic_pass:
                  summary: A generic pass with a positional presentation
                  value:
                    partner_reference: acme-events-badge-0001
                    type: generic_pass
                    version: 2
                    fields:
                      - id: attendee_name
                        label:
                          default: Attendee
                        value:
                          default: Sarah Connor
                        data_category: identity
                        semantic_type: participant.full_name
                        importance: 5
                      - id: access_level
                        label:
                          default: Access level
                        value:
                          default: VIP
                        data_category: status
                        importance: 4
                      - id: ticket_number
                        label:
                          default: Ticket number
                        value:
                          default: AM2026-0001
                        data_category: verification
                        importance: 3
                      - id: start_time
                        label:
                          default: Start time
                        value:
                          default: '2026-09-15T19:00:00.000Z'
                        data_type: date_time
                        data_category: time
                        time_style: short
                        importance: 4
                      - id: gate
                        label:
                          default: Gate
                        value:
                          default: B22
                        data_category: location
                        importance: 4
                      - id: terminal
                        label:
                          default: Terminal
                        value:
                          default: '1'
                        data_category: location
                        importance: 4
                    presentation:
                      positional:
                        primary:
                          items:
                            - field_id: attendee_name
                              alignment: full
                        secondary:
                          - items:
                              - field_id: access_level
                                alignment: start
                              - field_id: ticket_number
                                alignment: end
                        footer:
                          items:
                            - field_id: gate
                              join_field_id: terminal
                              alignment: start
                            - field_id: start_time
                              alignment: end
        '304':
          description: Pass unchanged since the supplied `ETag`.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Pass not found. Revolut stops polling it.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pass_not_found:
                  value:
                    code: pass_not_found
                    message: No pass found for this partner_reference.
        '410':
          description: Pass permanently gone. Revolut stops polling it.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pass_void:
                  value:
                    code: pass_void
                    message: The pass has been voided or refunded.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: |
        **Mutual TLS.** Revolut presents a client certificate signed by the Revolut Partner CA.
        Validate it against the Revolut CA chain from onboarding and reject any request without a
        valid Revolut certificate. Your Partner ID is bound to it. Can be used on its own, or
        layered on top of JWS for defence in depth.
    jws:
      type: apiKey
      in: header
      name: Jws-Signature
      description: |
        **Message signing (JWS).** Revolut signs the request body together with a timestamp (to
        prevent replay) as a detached JWS (`RS256`/`ES256`) using the Revolut Partner signing key
        whose certificate you registered during onboarding, and sends the compact JWS in the
        `Jws-Signature` header. You verify it against the registered Revolut certificate. May be
        used on its own or together with mTLS.
    oauth2:
      type: oauth2
      description: |
        OAuth 2.0 **client credentials**. Revolut requests a short-lived access token from your
        token endpoint (authenticating with its onboarding credential: `client_secret`,
        `private_key_jwt`, or its mTLS certificate) and sends it as `Authorization: Bearer <token>`.
        The token carries the `passes.read` scope. May be used on its own or together with mTLS.
      flows:
        clientCredentials:
          tokenUrl: https://your-token-endpoint.example/oauth/token
          scopes:
            passes.read: Read transaction outcomes and pass state.
  parameters:
    ApiVersion:
      name: Revolut-Api-Version
      in: header
      required: true
      description: |
        Contract version Revolut is calling with, e.g. `2026-07-01`.

        :::note
        If you receive a version you do not implement, respond with `400`.
        :::
      schema:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      example: '2026-07-01'
    RequestId:
      name: Request-Id
      in: header
      required: false
      description: Revolut's correlation id for this request. Echo it back in your response.
      schema:
        type: string
      example: 01970c4c-5790-7fb5-8331-84dfa075bbe9
  headers:
    RequestId:
      description: Correlation id for the response. Echo the incoming `Request-Id` when present.
      schema:
        type: string
    ETag:
      description: |
        Opaque strong entity tag for the current pass state. Do not use the `W/` weak validator
        prefix. Return a fresh value with every `200` response.
      schema:
        type: string
      example: '"v4"'
    RetryAfter:
      description: |
        Integer seconds Revolut should wait before retrying (not the HTTP-date form).
        `0` means retry immediately.
      schema:
        type: integer
        minimum: 0
      example: 30
  schemas:
    TransactionOutcomesSearchRequest:
      type: object
      description: |
        Request body for `POST /transaction-outcomes/search`. Contains the transaction context
        Revolut sends for you to match.
      required:
        - transaction_context
      properties:
        transaction_context:
          $ref: '#/components/schemas/TransactionContext'
    TransactionContext:
      type: object
      description: Identifiers Revolut supplies so you can match the originating transaction.
      required:
        - rrn
        - merchant_id
        - transaction_at
      properties:
        rrn:
          type: string
          description: ISO 8583 Retrieval Reference Number of the original payment.
          examples:
            - '123456789012'
        merchant_id:
          type: string
          description: Card acceptor identifier (DE 42 in ISO 8583 messaging); identifies the sub-merchant for aggregators.
          examples:
            - mer_example_01
        transaction_at:
          type: string
          format: date-time
          description: Timestamp of the purchase, UTC, ISO 8601.
          examples:
            - '2026-07-01T12:00:00.000Z'
        total:
          description: Transaction total, supplied for stronger matching. You may choose not to validate it.
          $ref: '#/components/schemas/Money'
    TransactionOutcomes:
      type: object
      description: |
        What a Revolut-card transaction produced. Currently the passes tied to the transaction.
        Revolut ignores unknown fields in this response, so you may add fields without breaking
        compatibility.
      required:
        - passes
      properties:
        passes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PassCreate'
    Error:
      type: object
      description: Standard error body for 4xx/5xx responses.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable snake_case error code.
        message:
          type: string
          description: Human-readable explanation.
        error_id:
          type: string
          description: Your trace id
          if you have one.: null
    Money:
      type: object
      description: ISO 4217 monetary amount, represented as strings to preserve decimal precision.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: Decimal amount as a string (e.g. "72.40").
          examples:
            - '72.40'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code (e.g. GBP, EUR, USD).
          examples:
            - GBP
    Image:
      type: object
      description: An image used by pass branding.
      oneOf:
        - required:
            - asset_ref
          not:
            required:
              - data
        - required:
            - data
            - format
          not:
            required:
              - asset_ref
      properties:
        asset_ref:
          type: string
          pattern: ^revasset://(public|private)/[0-9a-fA-F-]{36}$
          description: Reference to an image asset managed by Revolut.
          examples:
            - revasset://public/3f9a1c2e-8b7d-4e6a-9f10-2c3b4d5e6f70
        data:
          type: string
          contentEncoding: base64
          minLength: 1
          description: Base64-encoded image bytes.
          examples:
            - iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
        format:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
          description: Image MIME type.
          examples:
            - image/png
        description:
          type: string
          description: Accessible description of the image.
    ColourScheme:
      type: object
      description: Explicit colours used to render a branded pass.
      required:
        - primary
        - secondary
        - background
        - text_primary
        - text_secondary
        - label_primary
        - label_secondary
      properties:
        primary:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        secondary:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        background:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        text_primary:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        text_secondary:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        label_primary:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        label_secondary:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
    Branding:
      type: object
      description: Optional visual branding for a pass.
      required:
        - brand_name
        - logo
        - background_image
      oneOf:
        - required:
            - predefined_style
        - required:
            - colours
      properties:
        brand_name:
          type: string
          minLength: 1
          maxLength: 25
          description: Brand name displayed on the pass.
          examples:
            - Acme Events
        logo:
          description: Logo image used by the pass.
          $ref: '#/components/schemas/Image'
        background_image:
          description: Background or hero image used by the pass.
          $ref: '#/components/schemas/Image'
        predefined_style:
          type: string
          enum:
            - material
            - flat
            - glass
          description: Predefined visual style for the pass.
          examples:
            - material
        colours:
          description: Explicit colour scheme for the pass.
          $ref: '#/components/schemas/ColourScheme'
    Issuer:
      type: object
      description: Issuer information displayed on a pass.
      required:
        - issuer_id
        - issuer_full_name
        - issuer_display_name
      properties:
        issuer_id:
          type: string
          format: uuid
          description: Unique identifier of the issuer.
          examples:
            - 3f9a1c2e-8b7d-4e6a-9f10-2c3b4d5e6f70
        issuer_full_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Full legal name of the issuer.
          examples:
            - Acme Events Ltd
        issuer_display_name:
          type: string
          minLength: 1
          maxLength: 25
          description: Display name of the issuer.
          examples:
            - Acme Events
    LocalisedText:
      type: object
      description: Text with optional localisation support.
      required:
        - default
      properties:
        default:
          type: string
          description: Fallback text when no localisation matches.
        localisation_key:
          type: string
          description: Key resolved against Revolut's localisation catalogue at render time.
    Action:
      type: object
      description: A button rendered on the pass (e.g. "Open website", "Get directions").
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Unique identifier for the action within this pass.
        type:
          type: string
          description: 'Documented values: `open_external_url`. External URL domain needs to be registered at onboarding.'
        label:
          description: Display label for the button, with optional localisation.
          $ref: '#/components/schemas/LocalisedText'
        url:
          type: string
          format: uri
          description: Target URL for `open_external_url` actions.
        importance:
          type: integer
          minimum: 1
          maximum: 5
          description: Relative prominence of this action (5 = primary, 1 = least prominent).
    Coordinates:
      type: object
      description: Geographic coordinates (WGS 84).
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          description: Latitude in decimal degrees.
        lng:
          type: number
          format: double
          description: Longitude in decimal degrees.
    Presentation:
      type: object
      description: How a trigger is presented to the customer.
      properties:
        presentation_type:
          type: string
          description: 'Documented values: `notification`, `tile`.'
        title:
          description: Title text for the notification or tile, with optional localisation.
          $ref: '#/components/schemas/LocalisedText'
        description:
          description: Body text for the notification or tile, with optional localisation.
          $ref: '#/components/schemas/LocalisedText'
    Trigger:
      type: object
      description: A context-aware notification that nudges the customer (e.g. proximity alert, time before event).
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Unique identifier for the trigger within this pass.
        type:
          type: string
          description: 'Documented values: `proximity_time`, `proximity_geo_location`, `field_change`.'
        importance:
          type: integer
          minimum: 1
          maximum: 5
          description: Relative prominence of this trigger (5 = high, 1 = low).
        time_target:
          type: string
          description: Reference to a datetime field (e.g. `flight.scheduled_departure_at`).
        time_offset:
          type: string
          description: ISO 8601 duration before the target (e.g. `PT1H` for 1 hour before departure).
        location_targets:
          type: array
          description: Geographic coordinates for proximity-based triggers.
          items:
            $ref: '#/components/schemas/Coordinates'
        radius_meters:
          type: integer
          minimum: 0
          description: Radius in meters around the `location_targets` coordinates for the proximity alert.
        field_target:
          type: string
          description: Name of the semantic field to watch for changes (e.g. `boarding.gate`).
        presentation:
          description: How the trigger is presented to the customer (notification, tile).
          $ref: '#/components/schemas/Presentation'
    PassBase:
      type: object
      description: Fields common to every pass type.
      required:
        - type
        - partner_reference
        - version
      properties:
        partner_reference:
          type: string
          maxLength: 128
          description: Your own reference for the pass; use it to match the pass in your system.
          examples:
            - skyjet-2241-R7K92M
        type:
          type: string
          description: |
            Pass type discriminator. Selects the `semantics` structure for boarding, event, and loyalty
            passes. Generic passes are rendered from their `fields` and `presentation`. Documented values:
            `boarding_pass`, `event_pass`, `loyalty_pass`, `generic_pass`.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Your monotonically increasing version; bump on every change.
          examples:
            - 1
        relevant_at:
          type: string
          format: date-time
          description: When the pass becomes time-relevant (departure, event start); drives polling cadence.
        branding:
          description: Optional visual branding for the pass.
          $ref: '#/components/schemas/Branding'
        issuer:
          description: Optional issuer information displayed on the pass.
          $ref: '#/components/schemas/Issuer'
        actions:
          type: array
          description: Buttons rendered on the pass.
          items:
            $ref: '#/components/schemas/Action'
        triggers:
          type: array
          description: Context-aware notifications that nudge the customer.
          items:
            $ref: '#/components/schemas/Trigger'
    Passenger:
      type: object
      description: Passenger details for a boarding pass.
      required:
        - full_name
      properties:
        full_name:
          type: string
          description: Full name of the passenger as it appears on the boarding pass.
          examples:
            - Sarah Connor
        fare_class:
          type: string
          description: Human-readable fare class (e.g. Economy, Business, First).
          examples:
            - Economy
        fare_class_code:
          type: string
          description: IATA fare class code (single letter, e.g. Y for Economy, J for Business).
          examples:
            - 'Y'
        frequent_flyer_program:
          type: string
          description: Name of the frequent flyer program the passenger belongs to.
        frequent_flyer_number:
          type: string
          description: Membership number within the frequent flyer program.
    Airport:
      type: object
      description: Airport details for a flight.
      required:
        - iata
      properties:
        iata:
          type: string
          description: IATA airport code (3 uppercase letters).
          pattern: ^[A-Z]{3}$
          examples:
            - LTN
        name:
          type: string
          description: Full name of the airport (e.g. London Luton Airport).
        city:
          type: string
          description: City where the airport is located.
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: ^[A-Z]{2}$
        terminal:
          type: string
          description: Terminal identifier at the airport.
          examples:
            - '1'
    Flight:
      type: object
      description: Flight details for a boarding pass.
      required:
        - flight_number
        - carrier_code
        - departure_airport
        - arrival_airport
        - scheduled_departure_at
        - scheduled_arrival_at
      properties:
        flight_number:
          type: string
          description: Flight number without the carrier code (e.g. 2241, not SJ2241).
          examples:
            - '2241'
        carrier_code:
          type: string
          description: IATA or ICAO carrier code (2 alphanumeric characters).
          pattern: ^[A-Z0-9]{2}$
          examples:
            - W6
        carrier_name:
          type: string
          description: Display name of the operating carrier.
          examples:
            - SkyJet Airlines
        operating_carrier_code:
          type: string
          description: Carrier code of the actual operating carrier (for codeshare flights, this may differ from `carrier_code`).
          pattern: ^[A-Z0-9]{2}$
        departure_airport:
          description: Departure airport.
          $ref: '#/components/schemas/Airport'
        arrival_airport:
          description: Arrival airport.
          $ref: '#/components/schemas/Airport'
        scheduled_departure_at:
          type: string
          format: date-time
          description: Scheduled departure time, UTC, ISO 8601.
        scheduled_arrival_at:
          type: string
          format: date-time
          description: Scheduled arrival time, UTC, ISO 8601.
        aircraft_type:
          type: string
          description: IATA aircraft type code (e.g. A320, B738).
          examples:
            - A320
    Boarding:
      type: object
      description: Boarding details for a flight — gate, seat, and boarding time.
      properties:
        gate:
          type: string
          description: Boarding gate at the departure airport.
          examples:
            - B22
        boarding_at:
          type: string
          format: date-time
          description: Scheduled boarding time, UTC, ISO 8601.
        boarding_group:
          type: string
          description: Boarding group or zone (airline-specific, e.g. A, B, 1, 2).
        sequence_number:
          type: string
          description: Boarding sequence number assigned to the passenger.
        seat:
          type: string
          description: Assigned seat number (e.g. 14C, 22A).
          examples:
            - 14C
        seat_class:
          type: string
          description: Seat class label (e.g. Economy, Premium Economy, Business).
          examples:
            - Economy
    Booking:
      type: object
      description: Booking details for a boarding pass.
      required:
        - pnr
      properties:
        pnr:
          type: string
          description: Passenger Name Record — the booking reference from the airline's reservation system.
          examples:
            - R7K92M
        ticket_number:
          type: string
          description: 13-digit IATA ticket number.
          pattern: ^[0-9]{13}$
        booking_reference:
          type: string
          description: Alternative booking reference (e.g. agency or GDS reference), if different from the PNR.
    Validity:
      type: object
      description: Validity window for a pass — when it becomes active and when it expires.
      properties:
        valid_from:
          type: string
          format: date-time
          description: Start of the pass validity period, UTC, ISO 8601.
        valid_until:
          type: string
          format: date-time
          description: End of the pass validity period, UTC, ISO 8601.
    BoardingPassSemantics:
      type: object
      description: Semantic tags for a boarding pass.
      required:
        - passenger
        - flight
        - booking
      properties:
        passenger:
          description: Passenger details.
          $ref: '#/components/schemas/Passenger'
        flight:
          description: Flight details.
          $ref: '#/components/schemas/Flight'
        boarding:
          description: Boarding details (gate, seat, boarding time).
          $ref: '#/components/schemas/Boarding'
        booking:
          description: Booking details (PNR, ticket number).
          $ref: '#/components/schemas/Booking'
        validity:
          description: Optional validity window for the pass.
          $ref: '#/components/schemas/Validity'
    BoardingPass:
      allOf:
        - $ref: '#/components/schemas/PassBase'
        - type: object
          required:
            - semantics
          properties:
            type:
              type: string
              enum:
                - boarding_pass
            semantics:
              $ref: '#/components/schemas/BoardingPassSemantics'
    BoardingPassCreate:
      description: A boarding pass being created, comprising the pass content plus its render template.
      allOf:
        - $ref: '#/components/schemas/BoardingPass'
        - type: object
          properties:
            template_id:
              type: string
              description: |
                Identifier of a pre-registered branding/layout template to render this pass with.
                If omitted, Revolut uses the default template for your partner account, which may
                not match your brand. Including it ensures your pass is rendered with the correct
                visual design. Set at creation and immutable; not accepted when updating a pass.
              examples:
                - tmpl_skyjet_boarding
    Event:
      type: object
      description: Event details for an event pass.
      required:
        - name
        - held_on
        - starts_at
      properties:
        name:
          type: string
          description: Name of the event.
          examples:
            - 'The Blue Lights: Live'
        category:
          type: string
          description: 'Documented values: `concert`, `sport`, `conference`, `theatre`, `festival`, `race`, `other`.'
        edition:
          type: string
          description: Edition or iteration of a recurring event (e.g. 2026, Season 5).
        held_on:
          type: string
          format: date
          description: Calendar day of the event (use `starts_at` for the precise start time).
        starts_at:
          type: string
          format: date-time
          description: Start time of the event, UTC, ISO 8601.
        ends_at:
          type: string
          format: date-time
          description: End time of the event, UTC, ISO 8601.
        doors_open_at:
          type: string
          format: date-time
          description: Time the venue doors open, UTC, ISO 8601.
    Venue:
      type: object
      description: Venue details for an event.
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the venue.
          examples:
            - Grand Arena
        address:
          type: string
          description: Street address of the venue.
        city:
          type: string
          description: City where the venue is located.
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: ^[A-Z]{2}$
        coordinates:
          description: Geographic coordinates of the venue.
          $ref: '#/components/schemas/Coordinates'
        gate:
          type: string
          description: Entrance gate at the venue.
        section:
          type: string
          description: Section or block within the venue (e.g. Block 112, Section C).
        row:
          type: string
          description: Row identifier within the section.
        seat:
          type: string
          description: Seat number within the row.
    Ticket:
      type: object
      description: Ticket details for an event pass.
      properties:
        number:
          type: string
          description: Ticket number or barcode value.
        booking_reference:
          type: string
          description: Booking or order reference for the ticket purchase.
        type:
          type: string
          description: 'Documented values: `general_admission`, `seated`, `vip`, `backstage`, `staff`.'
    Participant:
      type: object
      description: Participant details for an event pass (e.g. conference attendee).
      properties:
        full_name:
          type: string
          description: Full name of the participant.
        company:
          type: string
          description: Company or organisation the participant represents.
        role:
          type: string
          description: Role or title at the event (e.g. Speaker, Attendee, Volunteer).
    Organiser:
      type: object
      description: Organiser of the event.
      properties:
        name:
          type: string
          description: Name of the organising company or individual.
    EventPassSemantics:
      type: object
      description: Semantic tags for an event pass.
      required:
        - event
        - venue
      properties:
        event:
          description: Event details (name, category, dates).
          $ref: '#/components/schemas/Event'
        venue:
          description: Venue details (name, address, seat).
          $ref: '#/components/schemas/Venue'
        ticket:
          description: Ticket details (number, type, booking reference).
          $ref: '#/components/schemas/Ticket'
        participant:
          description: Participant details (name, company, role).
          $ref: '#/components/schemas/Participant'
        organiser:
          description: Organiser details.
          $ref: '#/components/schemas/Organiser'
        validity:
          description: Optional validity window for the pass.
          $ref: '#/components/schemas/Validity'
    EventPass:
      allOf:
        - $ref: '#/components/schemas/PassBase'
        - type: object
          required:
            - semantics
          properties:
            type:
              type: string
              enum:
                - event_pass
            semantics:
              $ref: '#/components/schemas/EventPassSemantics'
    EventPassCreate:
      description: An event pass being created, comprising the pass content plus its render template.
      allOf:
        - $ref: '#/components/schemas/EventPass'
        - type: object
          properties:
            template_id:
              type: string
              description: |
                Identifier of a pre-registered branding/layout template to render this pass with.
                If omitted, Revolut uses the default template for your partner account, which may
                not match your brand. Including it ensures your pass is rendered with the correct
                visual design. Set at creation and immutable; not accepted when updating a pass.
              examples:
                - tmpl_acmeconcerts_event
    Member:
      type: object
      description: Member details for a loyalty pass.
      required:
        - full_name
        - member_id
      properties:
        full_name:
          type: string
          description: Full name of the loyalty program member.
          examples:
            - Stefan Pantic
        member_id:
          type: string
          description: Membership number or ID within the loyalty program.
          examples:
            - '9988776655'
        member_since_on:
          type: string
          format: date
          description: Date the member joined the programme.
    TierProgress:
      type: object
      description: Progress towards the next loyalty tier.
      properties:
        current:
          type: string
          description: Current progress value as a string (e.g. points earned this period).
        target:
          type: string
          description: Target value required to reach the next tier, as a string.
        unit:
          type: string
          description: Unit of measurement for the progress values (e.g. points, stays, flights).
          examples:
            - points
    PointsBalance:
      type: object
      description: Points balance for a loyalty pass.
      properties:
        value:
          type: string
          description: Current points balance as a string (to preserve integer precision).
          examples:
            - '1500'
        unit:
          type: string
          description: Unit label for the balance (e.g. points, miles).
          examples:
            - points
        monetary_value:
          description: Optional monetary equivalent of the points balance.
          $ref: '#/components/schemas/Money'
    NextReward:
      type: object
      description: Next reward the member can unlock with their points.
      properties:
        description:
          type: string
          description: Human-readable description of the reward (e.g. "Free coffee voucher").
        points_required:
          type: string
          description: Points required to unlock the reward, as a string.
          examples:
            - '5000'
    Loyalty:
      type: object
      description: Loyalty program details for a pass.
      required:
        - program_name
      properties:
        program_name:
          type: string
          description: Display name of the loyalty program.
          examples:
            - BrightPoints
        tier:
          type: string
          description: Current tier level of the member (e.g. Gold, Silver, Bronze).
          examples:
            - Gold
        tier_progress:
          description: Progress towards the next tier.
          $ref: '#/components/schemas/TierProgress'
        points_balance:
          description: Current points balance.
          $ref: '#/components/schemas/PointsBalance'
        next_reward:
          description: Next reward the member can unlock.
          $ref: '#/components/schemas/NextReward'
    LoyaltyPassSemantics:
      type: object
      description: Semantic tags for a loyalty pass.
      required:
        - member
        - loyalty
      properties:
        member:
          description: Member details (name, ID, join date).
          $ref: '#/components/schemas/Member'
        loyalty:
          description: Loyalty program details (tier, balance, next reward).
          $ref: '#/components/schemas/Loyalty'
        validity:
          description: Optional validity window for the pass.
          $ref: '#/components/schemas/Validity'
    LoyaltyPass:
      allOf:
        - $ref: '#/components/schemas/PassBase'
        - type: object
          required:
            - semantics
          properties:
            type:
              type: string
              enum:
                - loyalty_pass
            semantics:
              $ref: '#/components/schemas/LoyaltyPassSemantics'
    LoyaltyPassCreate:
      description: A loyalty pass being created, comprising the pass content plus its render template.
      allOf:
        - $ref: '#/components/schemas/LoyaltyPass'
        - type: object
          properties:
            template_id:
              type: string
              description: |
                Identifier of a pre-registered branding/layout template to render this pass with.
                If omitted, Revolut uses the default template for your partner account, which may
                not match your brand. Including it ensures your pass is rendered with the correct
                visual design. Set at creation and immutable; not accepted when updating a pass.
              examples:
                - tmpl_brightpoints_loyalty
    FieldId:
      type: string
      pattern: ^[a-zA-Z0-9_-]+$
      description: Unique identifier for a custom field within a generic pass.
      examples:
        - departure_gate
    DataCategory:
      type: string
      enum:
        - identity
        - status
        - time
        - location
        - verification
        - attribute
        - governance
      description: |
        Data category for the field. The category describes the type of information carried by
        the field.

        - `identity`: primary subjects, holder names, pass titles, or card names.
        - `status`: state metrics, membership tiers, or operational updates such as Delayed, Gold Tier,
          or Active.
        - `time`: temporal coordinates such as Start Time 19:00, boarding times, or expiry times.
        - `location`: spatial coordinates or places such as Seat 14C, Gate A7, venues, or addresses.
        - `verification`: human-readable fallback codes, member IDs, or order references.
        - `attribute`: domain properties such as Meal: Vegan, Class: Business, or Points: 1,400.
        - `governance`: contractual, legal, or reference information such as terms, disclaimers, or
          support phone numbers.
      examples:
        - identity
        - status
        - time
        - location
        - verification
        - attribute
        - governance
    FieldSemanticType:
      type: string
      minLength: 1
      description: |
        Optional semantic tag associated with the field. 

        The following values are currently exposed by the typed pass schemas in current API version.
        Use the public snake_case path names.

        **Boarding passes**

        `passenger.full_name`, `passenger.fare_class`, `passenger.fare_class_code`,
        `passenger.frequent_flyer_program`, `passenger.frequent_flyer_number`, `flight.flight_number`,
        `flight.carrier_code`, `flight.carrier_name`, `flight.operating_carrier_code`,
        `flight.departure_airport.iata`, `flight.departure_airport.name`, `flight.departure_airport.city`,
        `flight.departure_airport.country_code`, `flight.departure_airport.terminal`,
        `flight.arrival_airport.iata`, `flight.arrival_airport.name`, `flight.arrival_airport.city`,
        `flight.arrival_airport.country_code`, `flight.arrival_airport.terminal`,
        `flight.scheduled_departure_at`, `flight.scheduled_arrival_at`, `flight.aircraft_type`,
        `boarding.gate`, `boarding.boarding_at`, `boarding.boarding_group`, `boarding.sequence_number`,
        `boarding.seat`, `boarding.seat_class`, `booking.pnr`, `booking.ticket_number`,
        `booking.booking_reference`, `validity.valid_from`, `validity.valid_until`.

        **Event passes**

        `event.name`, `event.category`, `event.edition`, `event.held_on`, `event.starts_at`,
        `event.ends_at`, `event.doors_open_at`, `venue.name`, `venue.address`, `venue.city`,
        `venue.country_code`, `venue.coordinates.lat`, `venue.coordinates.lng`, `venue.gate`,
        `venue.section`, `venue.row`, `venue.seat`, `ticket.number`, `ticket.booking_reference`,
        `ticket.type`, `participant.full_name`, `participant.company`, `participant.role`,
        `organiser.name`, `validity.valid_from`, `validity.valid_until`.

        **Loyalty passes**

        `member.full_name`, `member.member_id`, `member.member_since_on`, `loyalty.program_name`,
        `loyalty.tier`, `loyalty.tier_progress.current`, `loyalty.tier_progress.target`,
        `loyalty.tier_progress.unit`, `loyalty.points_balance.value`, `loyalty.points_balance.unit`,
        `loyalty.points_balance.monetary_value.amount`, `loyalty.points_balance.monetary_value.currency`,
        `loyalty.next_reward.description`, `loyalty.next_reward.points_required`,
        `validity.valid_from`, `validity.valid_until`.
      examples:
        - passenger.full_name
        - event.name
        - participant.full_name
        - venue.coordinates.lat
        - loyalty.points_balance.value
    FieldData:
      type: object
      description: |
        Shared content, semantic metadata, and optional formatting hints for a generic-pass custom field.
        The field `id` is referenced from the pass `presentation` configuration. When neither the pass
        nor its template provides a presentation, every field must provide `data_category` and
        `semantic_type`; `importance` remains optional.
      required:
        - id
        - label
        - value
      properties:
        id:
          $ref: '#/components/schemas/FieldId'
        label:
          description: Display label for the field, with optional localisation.
          $ref: '#/components/schemas/LocalisedText'
        value:
          description: Display value for the field, with optional localisation.
          $ref: '#/components/schemas/LocalisedText'
        data_type:
          type: string
          description: Interpretation of the field value.
          enum:
            - text
            - number
            - currency
            - date_time
            - uri
          default: text
          examples:
            - text
        data_category:
          description: |
            Category describing the information carried by the field. Required on every field when
            rendering falls back to semantic metadata; otherwise optional.
          $ref: '#/components/schemas/DataCategory'
        semantic_type:
          description: |
            Semantic identifier associated with the field. Required on every field when rendering falls
            back to semantic metadata; otherwise optional.
          $ref: '#/components/schemas/FieldSemanticType'
        importance:
          type: integer
          minimum: 1
          maximum: 5
          description: |
            Optional relative prominence of the field (5 = highest, 1 = lowest), used for semantic
            rendering.
          examples:
            - 5
        text_alignment:
          type: string
          description: Preferred text alignment when the renderer supports it.
          enum:
            - left
            - center
            - right
            - natural
          examples:
            - natural
        date_style:
          type: string
          description: Preferred date display style for a `date_time` value.
          enum:
            - none
            - short
            - medium
            - long
            - full
          examples:
            - medium
        time_style:
          type: string
          description: Preferred time display style for a `date_time` value.
          enum:
            - none
            - short
            - medium
            - long
            - full
          examples:
            - short
        is_relative:
          type: boolean
          description: Whether a date and time value should be presented relative to the current time.
        ignores_time_zone:
          type: boolean
          description: Whether a date and time value should be shown without time-zone conversion.
        number_style:
          type: string
          description: Preferred display style for a numeric value.
          enum:
            - decimal
            - percent
            - scientific
            - spell_out
          examples:
            - decimal
        currency_code:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code used when presenting a currency value.
          examples:
            - EUR
    RowItem:
      type: object
      description: A field placed in a positional presentation row.
      required:
        - field_id
      properties:
        field_id:
          description: ID of the primary field displayed in this slot.
          $ref: '#/components/schemas/FieldId'
        join_field_id:
          description: Optional ID of a field joined to the primary field in the same slot.
          $ref: '#/components/schemas/FieldId'
        alignment:
          type: string
          description: Horizontal placement of the slot within its row.
          enum:
            - full
            - start
            - middle
            - end
          examples:
            - start
    PresentationRow:
      type: object
      description: A row in a positional generic-pass presentation.
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RowItem'
    PositionalPresentation:
      type: object
      description: |
        Maps field IDs into header, primary, secondary, and footer sections. This layout may be supplied on the
        pass or by its template. Every referenced ID must match a field in the pass, and every field ID
        must appear at least once as a `field_id` or `join_field_id` when this layout is used.
      required:
        - primary
      properties:
        header:
          description: Optional header section row, displayed before the primary section.
          $ref: '#/components/schemas/PresentationRow'
        primary:
          description: Primary section row, displayed after the header when provided.
          $ref: '#/components/schemas/PresentationRow'
        secondary:
          type: array
          minItems: 1
          maxItems: 3
          description: Optional secondary section rows, in display order.
          items:
            $ref: '#/components/schemas/PresentationRow'
        footer:
          description: Footer section row, displayed last.
          $ref: '#/components/schemas/PresentationRow'
    PositionalPresentationWrapper:
      type: object
      description: Wrapper for a positional presentation.
      required:
        - positional
      properties:
        positional:
          $ref: '#/components/schemas/PositionalPresentation'
    PresentationConfig:
      type: object
      description: |
        Optional explicit positional layout for a generic pass. When omitted, the template presentation
        is used. When neither provides a presentation, the pass is rendered from semantic metadata on
        every field.
      oneOf:
        - $ref: '#/components/schemas/PositionalPresentationWrapper'
    GenericPass:
      description: |
        A fields-driven generic pass. The `fields` array defines reusable field data and an optional
        `presentation` selects a positional layout. When `presentation` is omitted, the template
        presentation is used. When neither provides a presentation, the pass is rendered from semantic
        metadata: every field must provide `data_category` and `semantic_type`; `importance` is optional.
      allOf:
        - $ref: '#/components/schemas/PassBase'
        - type: object
          required:
            - fields
          properties:
            type:
              type: string
              enum:
                - generic_pass
              description: Pass type discriminator.
            fields:
              type: array
              minItems: 1
              description: Custom fields available to the selected presentation layout.
              items:
                $ref: '#/components/schemas/FieldData'
            presentation:
              description: |
                Optional explicit layout. When omitted, the template presentation is used. When neither
                provides a presentation, rendering falls back to semantic metadata on every field.
              $ref: '#/components/schemas/PresentationConfig'
    GenericPassCreate:
      description: A generic pass being created, comprising the pass content plus its render template.
      allOf:
        - $ref: '#/components/schemas/GenericPass'
        - type: object
          properties:
            template_id:
              type: string
              description: |
                Identifier of a pre-registered branding/layout template to render this pass with.
                If omitted, Revolut uses the default template for your partner account. Set at creation
                and immutable; not accepted when updating a pass.
              examples:
                - tmpl_acme_events_generic
    PassCreate:
      description: |
        A pass as created/provisioned, i.e. a concrete pass type plus the `template_id` that renders it.
        Used when a pass is created (`POST /passes`) or provisioned from a transaction outcome. New pass types
        may be added over time and are available in all supported API versions.
      required:
        - type
      oneOf:
        - $ref: '#/components/schemas/BoardingPassCreate'
        - $ref: '#/components/schemas/EventPassCreate'
        - $ref: '#/components/schemas/LoyaltyPassCreate'
        - $ref: '#/components/schemas/GenericPassCreate'
      discriminator:
        propertyName: type
        mapping:
          boarding_pass: '#/components/schemas/BoardingPassCreate'
          event_pass: '#/components/schemas/EventPassCreate'
          loyalty_pass: '#/components/schemas/LoyaltyPassCreate'
          generic_pass: '#/components/schemas/GenericPassCreate'
    PassUpdate:
      description: |
        The updatable state of a pass, i.e. one of the concrete types selected by `type`. Used both when you
        push an update and when Revolut polls you for the latest state. Excludes `template_id`, which is
        fixed at creation. New pass types may be added over time and are available in all supported API versions.
      oneOf:
        - $ref: '#/components/schemas/BoardingPass'
        - $ref: '#/components/schemas/EventPass'
        - $ref: '#/components/schemas/LoyaltyPass'
        - $ref: '#/components/schemas/GenericPass'
      discriminator:
        propertyName: type
        mapping:
          boarding_pass: '#/components/schemas/BoardingPass'
          event_pass: '#/components/schemas/EventPass'
          loyalty_pass: '#/components/schemas/LoyaltyPass'
          generic_pass: '#/components/schemas/GenericPass'
  responses:
    BadRequest:
      description: Malformed request or invalid body.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation_error:
              value:
                code: validation_error
                message: Request validation failed.
    Unauthorized:
      description: |
        Missing or invalid Revolut credentials: no or failed mTLS certificate, an invalid
        JWS signature, or a missing/invalid OAuth 2.0 access token.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_credentials:
              value:
                code: invalid_credentials
                message: Missing or invalid Revolut credentials.
    Forbidden:
      description: |
        Authenticated, but the credential lacks the required scope/permission (e.g. an OAuth token
        without `passes.read`).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficient_scope:
              value:
                code: insufficient_scope
                message: The credential does not have the passes.read scope.
    TooManyRequests:
      description: Rate limit exceeded. Revolut retries, honouring `Retry-After`.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              value:
                code: rate_limited
                message: Rate limit exceeded. Retry after the specified delay.
    ServiceUnavailable:
      description: Temporary capacity issue. Revolut retries, honouring `Retry-After`.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            temporarily_unavailable:
              value:
                code: temporarily_unavailable
                message: Service temporarily unavailable. Please retry.
