paths:
  /transaction-outcomes/search:
    post:
      tags:
        - '[PREVIEW] Transaction outcomes'
      operationId: searchTransactionOutcomes
      summary: '[PREVIEW] Fetch transaction outcomes for a transaction'
      description: |
        :::warning [Pre-release preview]
        This is a pre-release preview of upcoming documentation.
        The features, workflows, and UI described here are subject to change before the final release.
        :::

        Revolut calls this after detecting a Revolut-card transaction at your business. Match the
        transaction from the `transaction_context` and return what it produced.

        Revolut only calls for eligible purchase transactions, so `transaction_context.total` is
        always non-negative. Refunds and cancellations are never sent as new lookups - they
        surface as `410` (void outcome) on retries.

        Despite using `POST`, this is a **safe lookup** with no side effects: `POST` is used only to
        carry the match criteria in the body (keeping `rrn` out of URLs/logs and allowing the key to
        grow). No `Idempotency-Key` is required.

        **Status semantics (these drive our retry behaviour):**
        - `200`: transaction matched; return the outcomes (the `passes` and `digital_receipts` arrays may be empty).
        - `202`: transaction not ready yet (settlement lag); we retry, honouring `Retry-After`.
        - `404`: transaction definitively not found; we stop retrying.
        - `410`: transaction existed but its outcome is void (refund/cancellation); we stop.
        - `429` / `503`: temporary capacity issue; we retry, honouring `Retry-After`.

        Each pass in the `passes` array may use any supported **format**:
        - `revpass` — Revolut's native semantic model (boarding_pass, event_pass, loyalty_pass, generic_pass).
        - `pkpass_base64` — `.pkpass` file, base64-encoded.
        - `pkpass_url` — URL pointing to a `.pkpass` file.
        - `walletobjects_json` — A Wallet Objects resource family and its class/object pair under
          `walletobjects`.

        :::note
        Validate Revolut's credentials (mTLS, JWS, or OAuth 2.0) and reject any unauthenticated request with `401`.
        :::

        :::info
        See [Auto-provision transaction outcomes](https://developer.revolut.com/docs/guides/revolut-wallet/operations/transaction-outcomes) for matching logic and examples.
        :::
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionOutcomesSearchRequest'
            examples:
              lookup:
                value:
                  transaction_context:
                    rrn: '123456789012'
                    merchant_id: mer_example_01
                    transaction_at: '2026-07-01T12:00:00.000Z'
                    total:
                      amount: '12.20'
                      currency: GBP
      responses:
        '200':
          description: Transaction matched. Returns the outcomes it produced.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionOutcomes'
              examples:
                boarding_pass_revolut:
                  summary: A single boarding pass produced by the transaction (Revolut native format)
                  value:
                    passes:
                      - format: revpass
                        partner_reference: skyjet-2241-R7K92M
                        version: 1
                        template_id: tmpl_skyjet_boarding
                        rev_pass:
                          type: boarding_pass
                          relevant_at: '2026-08-02T06:15:00.000Z'
                          semantics:
                            passenger:
                              full_name: Ada Shannon
                            flight:
                              flight_number: '2241'
                              carrier_code: SJ
                              departure_airport:
                                iata: LTN
                                terminal: '1'
                              arrival_airport:
                                iata: OTP
                              scheduled_departure_at: '2026-08-02T06:15:00.000Z'
                              scheduled_arrival_at: '2026-08-02T09:40:00.000Z'
                            boarding:
                              gate: B22
                              seat: 14C
                            booking:
                              pnr: R7K92M
                generic_pass:
                  summary: A generic pass with a positional presentation
                  value:
                    passes:
                      - format: revpass
                        partner_reference: acme-events-badge-0001
                        version: 1
                        template_id: tmpl_acme_events_generic
                        rev_pass:
                          type: generic_pass
                          fields:
                            - id: attendee_name
                              label:
                                default: Attendee
                              value:
                                default: Richard Hopper
                              data_category: identity
                              semantic_type: participant.full_name
                              importance: 5
                            - id: access_status
                              label:
                                default: Access
                              value:
                                default: VIP access
                              data_category: status
                              importance: 4
                            - id: ticket_number
                              label:
                                default: Ticket number
                              value:
                                default: AM2026-0001
                              data_category: verification
                              importance: 4
                            - id: event_starts_at
                              label:
                                default: Starts at
                              value:
                                default: '2026-09-15T19:00:00.000Z'
                              data_type: date_time
                              data_category: time
                              date_style: medium
                              time_style: short
                              importance: 3
                            - id: terms_conditions
