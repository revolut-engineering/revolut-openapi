                              data_type: date_time
                              data_category: time
                              semantic_type: event.starts_at
                generic_pass_header:
                  summary: A generic pass with a header row
                  value:
                    passes:
                      - format: revpass
                        partner_reference: acme-events-header-0001
                        version: 1
                        template_id: tmpl_acme_events_generic
                        rev_pass:
                          type: generic_pass
                          fields:
                            - id: event_title
                              label:
                                default: Event
                              value:
                                default: Acme Future Festival
                              data_category: identity
                              semantic_type: event.name
                              importance: 5
                            - id: attendee_name
                              label:
                                default: Attendee
                              value:
                                default: Ada Shannon
                              data_category: identity
                              semantic_type: participant.full_name
                            - id: ticket_number
                              label:
                                default: Ticket number
                              value:
                                default: AM2026-0001
                              data_category: verification
                              semantic_type: ticket.number
                            - id: event_starts_at
                              label:
                                default: Starts at
                              value:
                                default: '2026-09-15T19:00:00.000Z'
                              data_type: date_time
                              data_category: time
                              semantic_type: event.starts_at
                          presentation:
                            positional:
                              header:
                                items:
                                  - field_id: event_title
                                    alignment: full
                              primary:
                                items:
                                  - field_id: attendee_name
                                    alignment: full
                              secondary:
                                - items:
                                    - field_id: ticket_number
                                      alignment: full
                              footer:
                                items:
