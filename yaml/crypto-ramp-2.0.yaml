  /sell-config:
    get:
      operationId: retrieve-sell-configuration
      tags:
        - Partners
      summary: Retrieve sell configuration
      description: |-
        Use this endpoint for the sell (off-ramp) flow.
        Retrieve the Revolut Ramp configuration for selling crypto for fiat, such as supported countries, fiat currencies and limits, crypto tokens, and payout methods.

        Use the returned values to check eligibility and to populate the parameters required by [`/sell-quote`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-a-sell-order-quote) and [`/sell`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-a-sell-redirect-url).
      parameters:
        - $ref: '#/components/parameters/XApiKey'
      security:
        - AccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellConfig'
              example:
                version: 1.0.0
                countries:
                  - GB
                  - PT
                  - FR
                fiat:
                  - currency: GBP
                    min_limit: 5
                    max_limit: 10000
                  - currency: EUR
                    min_limit: 6
                    max_limit: 11000
                crypto:
                  - id: BTC
                    currency: BTC
                    blockchain: BITCOIN
                  - id: ETH
                    currency: ETH
                    blockchain: ETHEREUM
                  - id: USDT-ETH
                    currency: USDT
                    blockchain: ETHEREUM
                    smartContractAddress: 1.2488751460129641e+48
                payout_methods:
                  - revolut
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/DisabledByKillSwitchErrorResponse'
  /sell-quote:
    get:
      operationId: retrieve-a-sell-order-quote
      tags:
        - Partners
      summary: Retrieve a sell order quote
      description: |-
        Use this endpoint for the sell (off-ramp) flow.
        Retrieve the estimated fiat proceeds and fees for selling crypto.
        Use it to display the estimated payout and fees to your customer before redirecting them via [`/sell`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-a-sell-redirect-url).
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/XApiKey'
        - in: query
          name: fiat
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code of the fiat currency that the customer wants to receive.
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyFiat'
        - in: query
          name: amount
          description: The crypto amount that the customer wants to sell.
          required: true
          schema:
            type: number
            format: float
            exclusiveMinimum: true
            minimum: 0
        - in: query
          name: crypto
          description: The ID of the crypto token to sell, obtained from the [`/sell-config`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-sell-configuration) endpoint.
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCryptoId'
        - in: query
          name: payment
          description: The payout method used to receive the fiat proceeds.
          required: true
          schema:
            type: string
            enum:
              - revolut
        - in: query
          name: region
          description: The [ISO 3166 Alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) code of the country of residence of the customer selling the crypto.
          required: true
          schema:
            $ref: '#/components/schemas/CountryCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellQuote'
              examples:
                WithPartnerFee:
                  summary: Quote including a partner fee
                  value:
                    service_fee:
                      amount: 2
                      currency: GBP
                    partner_fee:
                      amount: 1
                      currency: GBP
                    fiat:
                      amount: 98
                      currency: GBP
                WithoutPartnerFee:
                  summary: Quote without a partner fee
                  value:
                    service_fee:
                      amount: 1
                      currency: GBP
                    fiat:
                      amount: 99
                      currency: GBP
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/DisabledByKillSwitchErrorResponse'
  /sell:
    get:
      operationId: retrieve-a-sell-redirect-url
      tags:
        - Partners
      summary: Retrieve a sell redirect URL
      description: |-
        Use this endpoint for the sell (off-ramp) flow.
        Retrieve a redirect URL to the Ramp app widget for the provided sell parameters. Use it to redirect the customer to Revolut Ramp to sell crypto for fiat.

        :::note
        The `amount` in the Redirect URL is provided in the crypto currency's minor units, i.e. its smallest unit given its decimal precision (for example, satoshis for BTC, wei for ETH).
        For example, 0.064 ETH (18 decimals) is represented as `64000000000000000`, and 0.05 BTC (8 decimals) is represented as `5000000`.
        :::

        After the customer completes the sell, track the order status using [Webhooks](https://developer.revolut.com/docs/api/crypto-ramp#tag-webhooks) or by calling [`/sell-orders/{order_id}`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-a-sell-order).
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/XApiKey'
        - in: query
          name: fiat
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code of the fiat currency that the customer wants to receive.
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyFiat'
        - in: query
          name: amount
          description: The crypto amount that the customer wants to sell.
          required: true
          schema:
            type: number
            format: float
            exclusiveMinimum: true
            minimum: 0
        - in: query
          name: crypto
          description: The ID of the crypto token to sell, obtained from the [`/sell-config`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-sell-configuration) endpoint.
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCryptoId'
        - in: query
          name: payment
          description: The payout method used to receive the fiat proceeds.
          required: true
          schema:
            type: string
            enum:
              - revolut
        - in: query
          name: region
          description: The [ISO 3166 Alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) code of the country of residence of the customer selling the crypto.
          required: true
          schema:
            $ref: '#/components/schemas/CountryCode'
        - in: query
          name: wallet
          description: The address of the crypto wallet from which the customer sends the crypto.
          required: false
          schema:
            type: string
        - in: query
          name: orderId
          description: |-
            Your external identifier for the sell order.
            Should be either UUID or ULID.

            Although optional for creating the sell session, `orderId` is required to receive sell order webhook events and to retrieve the order with `/sell-orders/{order_id}`. If omitted, no sell order webhook events are sent.
          required: false
          schema:
            type: string
            format: uuid | ulid
        - in: query
          name: partnerRedirectUrl
          description: The URL to which to redirect the customer after the sale—for example, your website. If not provided, the customer is shown the transaction result in Revolut Ramp.
          required: false
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: |-
            The requested redirect URL

            :::note
            The `amount` in the Redirect URL is provided in the crypto currency's minor units, i.e. its smallest unit given its decimal precision (for example, satoshis for BTC, wei for ETH).
            For example, 0.064 ETH (18 decimals) is represented as `64000000000000000`, and 0.05 BTC (8 decimals) is represented as `5000000`.

            The returned URL contains an opaque, time-limited token. Use the URL exactly as returned and redirect the customer promptly.
            :::
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RampRedirectUrl'
              example:
                ramp_redirect_url: https://ramp.revolut.com/partner-sell-checkout?fiatCurrency=GBP&amount=64000000000000000&cryptoCurrency=ETH&blockchain=ETHEREUM&partnerId=a01798bc-7f0b-14ed-a12b-0e3fac1209ad&paymentMethod=REVOLUT&externalOrderId=2d1769bc-7aab-92ed-a10b-0232ac12090d&walletAddress=0x96e2B7Bf479f84e7A0a94f0620290B7D3E08f5EF&region=GB&partnerRedirectUrl=https%3A%2F%2Fcrypto.partner.com%2Forder%3ForderId%3D2d1769bc-7aab-92ed-a10b-0232ac12090d&token=token
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/DisabledByKillSwitchErrorResponse'
  /sell-orders/{order_id}:
