    SellOrderStatus:
      type: string
      description: |-
        The status of a sell order.

        - `AWAITING_DEPOSIT`: The order is awaiting the customer's crypto deposit.
        - `PROCESSING`: The crypto deposit was received and the order is being processed.
        - `COMPLETED`: The fiat payout was completed.
        - `FAILED`: The order reached a terminal failure outcome. See `fail_reason` for the public outcome reason.
      enum:
        - AWAITING_DEPOSIT
        - PROCESSING
        - COMPLETED
        - FAILED
    SellOrderFailReason:
      type: string
      description: |-
        The public outcome reason returned when the sell order status is `FAILED`.

        - `EXPIRED`: The expected crypto deposit was not received in time.
        - `REFUNDED`: The deposited crypto was returned.
        - `FAILED`: The order failed without a more specific public outcome.
        - `CREDITED_AS_CRYPTO`: The order breached the slippage threshold and the customer was credited in crypto.
      enum:
        - EXPIRED
        - REFUNDED
        - FAILED
        - CREDITED_AS_CRYPTO
    SellOrder:
      type: object
      description: Crypto to fiat exchange order
      required:
        - fiat
        - crypto
        - fees
        - exchange_rate
        - payment
        - created_at
        - updated_at
        - status
        - deposit_wallet_address
        - fees_partner_currency
      properties:
        id:
          type: string
          format: uuid | ulid
          description: |-
            Your external identifier for the sell order.
            Returned only if `orderId` was provided when the sell session was created.
        fiat:
          $ref: '#/components/schemas/MoneyFiat'
          description: |-
            The fiat amount paid to the customer.
            Until the order is completed, this is the estimated payout amount.
        crypto:
          $ref: '#/components/schemas/MoneyCryptoId'
          description: The crypto amount that the customer sells.
        fees:
          type: object
          description: |-
            The fees for the sell order.
            Until the order is completed, these are the estimated fees.
          required:
            - ramp_fee
          properties:
            ramp_fee:
              $ref: '#/components/schemas/MoneyFiat'
              description: Revolut Ramp fee, excluding the partner fee.
            partner_fee:
              $ref: '#/components/schemas/MoneyFiat'
              description: |-
                Partner fee. Absent if no partner fee applies.
                Unlike the buy flow, the sell flow does not support a per-request fee percentage; the partner fee is determined by your partner configuration agreed with Revolut.
        exchange_rate:
          type: number
          format: float
          description: |-
            The crypto-to-fiat exchange rate for the sell order.
            Until the order is completed, this is the estimated exchange rate.
        payment:
          type: string
          enum:
            - revolut
          description: The payout method used to receive the fiat proceeds.
        created_at:
          type: string
          format: date-time
          description: The UTC date and time of sell order creation in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        updated_at:
          type: string
          format: date-time
          description: The UTC date and time of the latest sell order update in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        status:
          $ref: '#/components/schemas/SellOrderStatus'
        fail_reason:
          $ref: '#/components/schemas/SellOrderFailReason'
        wallet:
          type: string
          description: The crypto wallet address from which the customer sends the crypto for the sell order.
        deposit_wallet_address:
          type: string
          description: The Revolut-generated crypto wallet address to which the customer must deposit the crypto for the sell order.
        transaction_hash:
          type: string
          description: |-
            The blockchain deposit transaction hash.
            Absent if no crypto deposit transaction has been associated with the order yet.
        fees_partner_currency:
          type: object
          description: |-
            The fees converted to the partner's currency.
            This object is always returned; it is returned as `{}` when a partner exchange rate is not available.
          properties:
            ramp_fee:
              $ref: '#/components/schemas/MoneyFiat'
              description: Revolut Ramp fee in the partner's currency.
            partner_fee:
              $ref: '#/components/schemas/MoneyFiat'
              description: Partner fee in the partner's currency.
      example:
        id: 2d1769bc-7aab-92ed-a10b-0232ac12090d
        fiat:
          amount: 98
          currency: GBP
        crypto:
          amount: 0.064
          currencyId: ETH
