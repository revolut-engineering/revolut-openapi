components:
  securitySchemes:
    AccessToken:
      type: apiKey
      in: header
      name: X-API-KEY
      description: |-
        Each Crypto Ramp API request must contain an authorization header in the following format to make a call: `X-API-KEY: {your_API_key}`. 

        Before you start, make sure that you have the correct API key. For more information, see the **Get started** guides: [Integrate with Revolut Ramp -> 2. Get Partner keys](https://developer.revolut.com/docs/guides/crypto-ramp/get-started/integrate-with-revolut-ramp#2-get-partner-keys).
  parameters:
    XApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: |-
        Your API key that you received during integration setup. 
        For more information, see the **Authorization** section.
      required: true
  schemas:
    Blockchain:
      type: string
      description: The cryptocurrency blockchain/network.
      enum:
        - BITCOIN
        - RIPPLE
        - BITCOINCASH
        - LITECOIN
        - ETHEREUM
        - DOGECOIN
        - CARDANO
        - STELLAR
        - POLKADOT
        - SOLANA
        - AVALANCHE
        - EOS
        - TEZOS
        - DASH
        - ALGORAND
        - CELO
        - SMARTCHAIN
        - POLYGON
        - FANTOM
        - OPTIMISM
        - COSMOS
        - KUSAMA
        - ETHEREUMCLASSIC
        - ETHEREUMPOW
        - HEDERAHASHGRAPH
        - TRON
        - KAVA
        - NEAR
        - SONGBIRD
        - FLARE
        - CELESTIA
        - BASE
    Config:
      type: object
      required:
        - version
        - countries
        - fiat
        - crypto
        - payment_methods
      properties:
        version:
          type: string
          description: The Revolut Ramp configuration version.
        countries:
          type: array
          description: The list of client countries supported by Ramp – for your customer to be able to use Revolut Ramp, they must be resident in one of those countries.
          items:
            $ref: '#/components/schemas/CountryCode'
        fiat:
          description: The supported fiat currencies and limits.
          type: array
          items:
            type: object
            description: The supported fiat currency and limits.
            required:
              - currency
              - min_limit
              - max_limit
            properties:
              currency:
                $ref: '#/components/schemas/CurrencyFiat'
                description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code of the supported currency.
              min_limit:
                type: number
                format: float
                description: The minimum allowed amount.
              max_limit:
                type: number
                format: float
                description: The maximum allowed amount.
        crypto:
          type: array
          description: The list of cryptocurrencies supported by Revolut Ramp.
          items:
            type: object
            description: Supported crypto currency.
            required:
              - id
              - currency
              - blockchain
            properties:
              id:
                type: string
                description: |-
                  The unique identifier of the crypto currency-blockchain pair.
                  Should be used throughout the API to reference the specific crypto.
                example: USDT-ETH
              currency:
                $ref: '#/components/schemas/CurrencyCryptoCode'
              blockchain:
                $ref: '#/components/schemas/Blockchain'
              smartContractAddress:
                type: string
                description: The smart contract address. Returned only for tokens.
        feePercentages:
          description: The list of fee percentages that can be applied for the order as partner fee.
          type: array
          items:
            type: number
            format: float
        payment_methods:
          description: The list of available payment methods.
          type: array
          items:
            type: string
            enum:
              - card
              - revolut
              - apple-pay
              - google-pay
      example:
        version: 1.0.0
        countries:
          - GB
          - US
          - PT
          - FR
        fiat:
          - currency: GBP
            min_limit: 50
            max_limit: 500
          - currency: USD
            min_limit: 60
            max_limit: 600
          - currency: EUR
            min_limit: 60
            max_limit: 600
        crypto:
          - id: BTC
            currency: BTC
            blockchain: BITCOIN
          - id: ETH
            currency: ETH
            blockchain: ETHEREUM
          - id: USDT-ETH
            currency: USDT
            blockchain: ETHEREUM
            smartContractAddress: 1.2488751460129641e+48
          - id: USDT-OPTIMISM
            currency: USDT
            blockchain: OPTIMISM
            smartContractAddress: 8.488563199836144e+47
        feePercentages:
          - 0.8
          - 1
        payment_methods:
          - card
          - revolut
          - apple-pay
          - google-pay
    SellConfig:
      type: object
      required:
        - version
        - countries
        - fiat
        - crypto
        - payout_methods
      properties:
        version:
          type: string
          description: The Revolut Ramp sell configuration version.
        countries:
          type: array
          description: The list of customer countries supported by Revolut Ramp for selling crypto – for your customer to be able to sell crypto via Revolut Ramp, they must be resident in one of those countries.
          items:
            $ref: '#/components/schemas/CountryCode'
        fiat:
          description: The supported payout currencies and limits.
          type: array
          items:
            type: object
            description: A supported fiat payout currency and its limits.
            required:
              - currency
              - min_limit
              - max_limit
            properties:
              currency:
                $ref: '#/components/schemas/CurrencyFiat'
                description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code of the supported payout currency.
              min_limit:
                type: number
                format: float
                description: The minimum allowed fiat payout amount.
              max_limit:
                type: number
                format: float
                description: The maximum allowed fiat payout amount.
        crypto:
          type: array
          description: The list of cryptocurrencies supported by Revolut Ramp for selling.
          items:
            type: object
            description: A supported crypto currency and blockchain pair.
            required:
              - id
              - currency
              - blockchain
            properties:
              id:
                type: string
                description: |-
                  The unique identifier of the crypto currency-blockchain pair.
                  Use it throughout the sell API to reference the specific crypto.
                example: USDT-ETH
              currency:
                $ref: '#/components/schemas/CurrencyCryptoCode'
              blockchain:
                $ref: '#/components/schemas/Blockchain'
              smartContractAddress:
                type: string
                description: The smart contract address. Returned only for tokens.
        payout_methods:
          description: The list of available fiat payout methods.
          type: array
          items:
            type: string
            enum:
              - revolut
      example:
        version: 1.0.0
        countries:
          - GB
          - PT
          - FR
        fiat:
          - currency: GBP
            min_limit: 5
            max_limit: 10000
          - currency: EUR
            min_limit: 6
            max_limit: 11000
        crypto:
          - id: BTC
            currency: BTC
            blockchain: BITCOIN
          - id: ETH
            currency: ETH
            blockchain: ETHEREUM
          - id: USDT-ETH
            currency: USDT
            blockchain: ETHEREUM
            smartContractAddress: 1.2488751460129641e+48
        payout_methods:
          - revolut
    CountryCode:
      type: string
      description: The [ISO 3166 Alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) code of the country.
      example: GB
    Currency:
      type: string
      description: The fiat currency [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code or [cryptocurrency code](https://en.wikipedia.org/wiki/List_of_cryptocurrencies).
      examples:
        fiatCurrency:
          summary: Fiat currency
          value: GBP
        cryptoCurrency:
          summary: Cryptocurrency
          value: ETH
    CurrencyFiat:
      type: string
      format: ISO 4217
      description: The fiat currency [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code.
      example: GBP
    CurrencyCryptoCode:
      type: string
      description: The [cryptocurrency code](https://en.wikipedia.org/wiki/List_of_cryptocurrencies).
      example: ETH
    CurrencyCryptoId:
      type: string
      description: The ID of the currency, obtained from the [`/config`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-configuration) or [`/sell-config`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-sell-configuration) endpoint.
      example: USDT-ETH
    EventType:
      type: string
      description: Webhook event type
      enum:
        - ORDER_CREATED
        - ORDER_PROCESSING
        - ORDER_COMPLETED
        - ORDER_FAILED
        - SELL_ORDER_CREATED
        - SELL_ORDER_PROCESSING
        - SELL_ORDER_COMPLETED
        - SELL_ORDER_FAILED
        - SELL_ORDER_EXPIRED
        - SELL_ORDER_REFUNDED
        - SELL_ORDER_CREDITED_AS_CRYPTO
    MoneyCryptoId:
      type: object
      required:
        - amount
        - currencyId
      properties:
        amount:
          type: number
          format: float
          description: The amount.
        currencyId:
          $ref: '#/components/schemas/CurrencyCryptoId'
      example:
        amount: 100
        currencyId: USDT-ETH
    MoneyFiat:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          format: float
          description: The amount.
        currency:
          $ref: '#/components/schemas/CurrencyFiat'
      example:
        amount: 100
        currency: USD
    Order:
      type: object
      description: Fiat to crypto exchange order
      required:
        - id
        - fiat
        - crypto
        - fees
        - exchange_rate
        - payment
        - created_at
        - updated_at
        - status
        - wallet
        - fees_partner_currency
      properties:
        id:
          type: string
          format: uuid
          description: The external UUID of the order.
        fiat:
          $ref: '#/components/schemas/MoneyFiat'
          description: The fiat amount that the customer paid for the crypto (excluding fees).
        crypto:
          $ref: '#/components/schemas/MoneyCryptoId'
          description: The crypto amount that the customer received.
        fees:
          type: object
          description: The fees for the order.
          required:
            - ramp_fee
            - partner_fee
            - network_fee
          properties:
            ramp_fee:
              $ref: '#/components/schemas/MoneyFiat'
              description: Revolut Ramp fee.
            partner_fee:
              $ref: '#/components/schemas/MoneyFiat'
              description: Partner fee.
            network_fee:
              $ref: '#/components/schemas/MoneyFiat'
              description: Crypto network fee.
        exchange_rate:
          type: number
          format: float
          description: The exchange rate for the order.
        payment:
          type: string
          enum:
            - card
            - revolut
