openapi: 3.0.3
info:
  version: 2.0.0
  title: Crypto Ramp API
  description: |-
    Revolut’s Crypto Ramp API allows you to integrate with Revolut and redirect users directly to our Ramp checkout experience, providing a smooth onramp and offramp experience for your users.
    The API endpoints are organised into thematic groups and let you leverage the following features:
    - [Partners](https://developer.revolut.com/docs/api/crypto-ramp#tag-partners) - retrieve supported assets and exchange quotes, and redirect customers to buy or sell crypto
    - [Webhooks](https://developer.revolut.com/docs/api/crypto-ramp#tag-webhooks) - track buy and sell order lifecycles with webhooks

    For more information, see the guides: [Leverage the Crypto Ramp API](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/use-the-api) and [Work with Webhooks -> Track order and payment lifecycle](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/work-with-webhooks/use-webhooks)
servers:
  - url: https://ramp-partners.revolut.com/partners/api/2.0
tags:
  - name: Partners
    description: |-
      The **Partners** endpoints let you retrieve supported assets and exchange quotes, display them on your website, and redirect customers to buy or sell crypto.

      For more details, see the guides: [Leverage the Crypto Ramp API](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/use-the-api).
  - name: Webhooks
    description: |-
      A webhook (also called a web callback) allows your system to receive an event from Ramp immediately after it happens.
      With the **Webhooks** endpoints, you can create, update, delete, and retrieve webhooks, as well as retrieve webhooks that you have created.

      For more details, see the guides: [Work with Webhooks -> Track order and payment lifecycle](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/work-with-webhooks/use-webhooks) and [-> Verify the payload signature](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/work-with-webhooks/verify-the-payload-signature).
paths:
  /config:
    get:
      operationId: retrieve-configuration
      tags:
        - Partners
      summary: Retrieve buy configuration
      description: |-
        Use this endpoint for the buy (on-ramp) flow.
        Retrieve the Revolut Ramp configuration for buying crypto with fiat, such as available fiat currencies and crypto tokens with corresponding limits and supported countries.

        For more information, see the guides: [Leverage the Crypto Ramp API -> Get your configuration details](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/use-the-api#get-your-configuration-details).
      parameters:
        - $ref: '#/components/parameters/XApiKey'
      security:
        - AccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
              example:
                version: 1.0.0
                countries:
                  - GB
                  - US
                  - PT
                  - FR
                fiat:
                  - currency: GBP
                    min_limit: 50
                    max_limit: 500
                  - currency: USD
                    min_limit: 60
                    max_limit: 600
                  - currency: EUR
                    min_limit: 60
                    max_limit: 600
                crypto:
                  - id: BTC
                    currency: BTC
                    blockchain: BITCOIN
                  - id: ETH
                    currency: ETH
                    blockchain: ETHEREUM
                  - id: USDT-ETH
                    currency: USDT
                    blockchain: ETHEREUM
                    smartContractAddress: 1.2488751460129641e+48
                  - id: USDT-OPTIMISM
                    currency: USDT
                    blockchain: OPTIMISM
                    smartContractAddress: 8.488563199836144e+47
                feePercentages:
                  - 0.8
                  - 1
                payment_methods:
                  - card
                  - revolut
                  - apple-pay
                  - google-pay
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/DisabledByKillSwitchErrorResponse'
  /quote:
    get:
      operationId: retrieve-an-order-quote
      tags:
        - Partners
      summary: Retrieve a buy order quote
      description: |-
        Use this endpoint for the buy (on-ramp) flow.
        Retrieve a buy order quote for exchanging fiat for crypto, including the current exchange rate, total crypto amount and fees.
        Use it to display potential exchange rate to your customer.

        For more information, see the guides: [Leverage the Crypto Ramp API -> Get an order quote](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/use-the-api#get-an-order-quote).
      security:
        - AccessToken: []
      parameters:
        - in: query
          name: fiat
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code of the selected fiat currency to use for the purchase.
          required: true
          schema:
            $ref: '#/components/schemas/Currency'
        - in: query
          name: amount
          description: The fiat amount to exchange for crypto.
          required: true
          schema:
            type: number
            format: float
        - in: query
          name: crypto
          description: The ID of the crypto token to purchase, obtained from the [`/config`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-configuration) endpoint.
          required: true
          schema:
            type: string
        - in: query
          name: payment
          description: The selected [payment option](https://developer.revolut.com/docs/guides/crypto-ramp/introduction-to-revolut-ramp/coverage-and-other-details/payment-options).
          required: true
          schema:
            type: string
            enum:
              - card
              - revolut
              - apple-pay
              - google-pay
        - in: query
          name: region
          description: The [ISO 3166 Alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) code of the country of residence of the customer (end user) ordering the exchange.
          required: true
          schema:
            $ref: '#/components/schemas/CountryCode'
        - in: query
          name: feePercentage
          description: The fee percentage that will be applied for the order as partner fee.
          required: false
          schema:
            type: number
            format: float
        - in: query
          name: walletAddress
          description: The address of the crypto wallet into which the purchased token should be transferred.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              example:
                service_fee:
                  amount: 3.76
                  currency: USD
                network_fee:
                  amount: 0.91
                  currency: USD
                crypto:
                  amount: 0.10604352
                  currencyId: ETH
                partner_fee:
                  amount: 0.77
                  currency: USD
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/DisabledByKillSwitchErrorResponse'
  /buy:
    get:
      operationId: retrieve-a-redirect-url
      tags:
        - Partners
      summary: Retrieve a buy redirect URL
      description: |-
        Use this endpoint for the buy (on-ramp) flow.
        Retrieve a redirect URL to the Ramp app widget for the provided buy parameters. Use it to redirect the customer to Revolut Ramp to buy crypto with fiat.

        :::note
        The `amount` in the Redirect URL is provided in minor currency units.
        For example, GBP 12.00 is represented as `1200`.
        :::

        For more information, see the guides: [Leverage the Crypto Ramp API -> Get a Revolut Ramp Redirect URL](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/use-the-api#get-a-revolut-ramp-redirect-url).
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/XApiKey'
        - in: query
          name: fiat
          description: The [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code of the selected fiat currency to use for the purchase.
          required: true
          schema:
            $ref: '#/components/schemas/Currency'
        - in: query
          name: amount
          description: The fiat amount to exchange for crypto.
          required: true
          schema:
            type: number
            format: float
        - in: query
          name: crypto
          description: The ID of the crypto token to purchase, obtained from the [`/config`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-configuration) endpoint.
          required: true
          schema:
            type: string
        - in: query
          name: payment
          description: The selected [payment option](https://developer.revolut.com/docs/guides/crypto-ramp/introduction-to-revolut-ramp/coverage-and-other-details/payment-options).
          required: true
          schema:
            type: string
            enum:
              - card
              - revolut
              - apple-pay
              - google-pay
        - in: query
          name: region
          description: The [ISO 3166 Alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) code of the country of residence of the customer (end user) ordering the exchange.
          required: true
          schema:
            $ref: '#/components/schemas/CountryCode'
        - in: query
          name: wallet
          description: The address of the crypto wallet into which to transfer the purchased token.
          required: true
          schema:
            type: string
        - in: query
          name: orderId
          description: |-
            The external identifier of the order to be made.
            Should be either UUID or ULID.
          schema:
            type: string
            format: uuid | ulid
        - in: query
          name: feePercentage
          description: The fee percentage that will be applied for the order as partner fee.
          required: false
          schema:
            type: number
            format: float
        - in: query
          name: partnerRedirectUrl
          description: The URL to which to redirect the customer after the purchase – for example, your website. If not provided, the customer is shown transaction result in Revolut Ramp.
          schema:
            type: string
        - in: query
          name: additionalProperties
          description: |-
            A prefix that allows passing arbitrary key-value pairs. 
            For each pair, the prefix and key should be separated by `.`.

            If such additional properties are provided, when you call the [`/orders`](https://developer.revolut.com/docs/api/crypto-ramp#retrieve-all-orders) endpoint, they are returned along with the order details.
          schema:
            type: string
            pattern: additionalProperties.[key]=[value]
      responses:
        '200':
          description: |-
            The requested redirect URL

            :::note
            The `amount` in the Redirect URL is provided in minor currency units.
            For example, GBP 12.00 is represented as `1200`.
            :::
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RampRedirectUrl'
              example:
                ramp_redirect_url: https://ramp.revolut.com?fiatCurrency=GBP&amount=12345&cryptoCurrency=ETH&walletAddress=0x96e2B7Bf479f84e7A0a94f0620290B7D3E08f5EF&countryCode=GB&partnerId=a01798bc-7f0b-14ed-a12b-0e3fac1209ad&externalOrderId=2d1769bc-7aab-92ed-a10b-0232ac12090d&disableFiatAmount=true&disableCryptoCurrency=true&disableWalletAddress=true&disableCountryCode=true&partnerRedirectUrl=https%3A%2F%2Fcrypto.partner.com%2Forder%3ForderId%3D2d1769bc-7aab-92ed-a10b-0232ac12090d
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/DisabledByKillSwitchErrorResponse'
  /orders/{order_id}:
    get:
      operationId: retrieve-an-order
      tags:
        - Partners
      summary: Retrieve a buy order
      description: |-
        Use this endpoint for the buy (on-ramp) flow.
        Retrieve a buy order by the `order_id` provided in the path and the `wallet` address provided as a query parameter.

        For more information, see the guides: [Leverage the Crypto Ramp API -> Get an order](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/use-the-api#get-an-order).
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/XApiKey'
        - in: path
          name: order_id
          description: |-
            The external identifier of the order to retrieve.
            Should be either UUID or ULID.
          required: true
          schema:
            type: string
            format: uuid | ulid
        - in: query
          name: wallet
          description: The address of the crypto wallet into which the token transfer was ordered.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                OrderExample:
                  $ref: '#/components/examples/OrderExample'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          description: Unauthorized
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          description: Too Many Requests
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/DisabledByKillSwitchErrorResponse'
  /orders:
    get:
      operationId: retrieve-all-orders
      tags:
        - Partners
      summary: Retrieve all buy orders
      description: |-
        Retrieve all orders by date range.

        The results are sorted chronologically by the `created_at` date (i.e. oldest first).

        For more information, see the guides: [Leverage the Crypto Ramp API -> Get all orders](https://developer.revolut.com/docs/guides/crypto-ramp/tutorials/use-the-api#get-all-orders).
      security:
        - AccessToken: []
      parameters:
        - $ref: '#/components/parameters/XApiKey'
        - in: query
          name: start
          description: |-
            The earliest date for the order creation date range (inclusive) in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.

            In other words, the "oldest" order creation date you are interested in.
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date
          description: |-
            The latest date for the order creation date range (inclusive) in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.

            In other words, the "most recent" order creation date you are interested in.
        - in: query
          name: skip
          schema:
            type: integer
            format: int32
            default: 0
          description: |-
            The number of orders to skip at the beginning of the range when fetching orders (sorted by creation date, oldest first).

            This means that if you set `skip=3`, the first three orders are skipped, and the list of orders that you get as a result will start with the order that would normally be 4th on the list.
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 1000
          description: |-
            The maximum number of orders to fetch from the given range.
            Must be between `1` and `1000` (inclusive).
            Default value is `100`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders'
              example:
                - id: a01868cc-71ab-d2ed-a10b-0a32ac1c0b02
                  fiat:
                    amount: 101.22
                    currency: USD
                  crypto:
                    amount: 0.10604352
