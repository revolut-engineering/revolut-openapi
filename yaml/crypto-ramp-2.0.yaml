      description: The exchange price between fiat and crypto currencies (including fees).
      required:
        - service_fee
        - network_fee
        - crypto
        - partner_fee
      properties:
        service_fee:
          $ref: '#/components/schemas/MoneyFiat'
          description: |-
            The sum of Revolut Ramp fee and Partner fee.

            :::note
            The Partner fee is also provided separately in the `partner_fee` parameter.
            :::
        network_fee:
          $ref: '#/components/schemas/MoneyFiat'
          description: Crypto network fee.
        crypto:
          $ref: '#/components/schemas/MoneyCryptoId'
          description: Crypto amount that the customer receives in the case of a successful exchange.
        partner_fee:
          $ref: '#/components/schemas/MoneyFiat'
          description: |-
            Partner fee.

            :::note
            This Partner fee is also included in the `service_fee` value, which represents the total sum of Partner fee and Revolut Ramp fee.
            :::
      example:
        service_fee:
          amount: 3.76
          currency: USD
        network_fee:
          amount: 0.91
          currency: USD
        crypto:
          amount: 0.10604352
          currencyId: ETH
        partner_fee:
          amount: 0.77
          currency: USD
    SellQuote:
      type: object
      description: The exchange price for selling crypto for fiat, including fees.
      required:
        - service_fee
        - fiat
      properties:
        service_fee:
          $ref: '#/components/schemas/MoneyFiat'
          description: |-
            The total service fee, including the partner fee when one applies.

            :::note
            The Partner fee is also provided separately in the `partner_fee` parameter.
            :::
        partner_fee:
          $ref: '#/components/schemas/MoneyFiat'
          description: |-
            Partner fee. Absent if no partner fee applies.
            Unlike the buy flow, the sell flow does not support a per-request fee percentage; the partner fee is determined by your partner configuration agreed with Revolut.

            :::note
            This Partner fee is also included in the `service_fee` value.
            :::
        fiat:
          $ref: '#/components/schemas/MoneyFiat'
          description: The estimated fiat amount that the customer receives after fees.
      example:
        service_fee:
          amount: 2
          currency: GBP
        partner_fee:
          amount: 1
          currency: GBP
        fiat:
          amount: 98
          currency: GBP
