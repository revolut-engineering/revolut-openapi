openapi: 3.1.0
info:
  title: '[PREVIEW] Revolut Wallet Partner API'
  version: '2026-07-01'
  description: |
    :::warning [Pre-release preview]
    This is a pre-release preview of upcoming documentation.
    The features, workflows, and UI described here are subject to change before the final release.
    :::

    Endpoints hosted by Revolut that partners call to put passes into Revolut Wallet and keep
    them current.

    - **Create a pass**: `POST /passes` registers a pass and returns its Revolut `id`.
    - **Push a pass update**: `PUT /passes/{id}` replaces the pass with its latest state and fans
      it out to every holder.

    You give each pass a **`partner_reference`**, which is your own key to match it in your system, and the
    value Revolut uses when it calls the endpoints you host (see the companion Wallet Partner Callbacks API,
    `/docs/api/revolut-wallet-callbacks`). Revolut assigns its own pass `id`, returned when you create a
    pass; use that `id` to address the pass on `PUT /passes/{id}`.

    Passes can be created in multiple formats: `revpass` (Revolut's native semantic model, including
    typed semantics and generic field dictionaries), `pkpass_base64`, `pkpass_url` (URL to download a .pkpass file),
    and `walletobjects_json` (Wallet Objects resource family and class/object pair).
    The `format` field on each request selects the encoding.

    :::info
    Start with the [Revolut Wallet guide](https://developer.revolut.com/docs/guides/revolut-wallet/introduction) and [Get started](https://developer.revolut.com/docs/guides/revolut-wallet/get-started) to onboard your business.
    :::
  contact:
    name: Revolut Wallet partner onboarding
    email: revwallet-partner-onboarding@revolut.com
    url: https://developer.revolut.com
servers:
  - url: https://partner.wallet.revolut.com
    description: Production
  - url: https://sandbox-partner.wallet.revolut.com
    description: Sandbox
security:
  - oauth2:
      - passes.write
  - oauth2:
      - passes.write
    mtls: []
  - jws: []
  - jws: []
    mtls: []
  - mtls: []
tags:
  - name: '[PREVIEW] Passes'
    description: |
      Create passes and push updates into Revolut Wallet.

      :::warning [Pre-release preview]
      This is a pre-release preview of upcoming documentation.
      The features, workflows, and UI described here are subject to change before the final release.
      :::
paths:
  /passes:
    post:
      tags:
        - '[PREVIEW] Passes'
      operationId: createPass
      summary: '[PREVIEW] Create a pass'
      description: |
        :::warning [Pre-release preview]
        This is a pre-release preview of upcoming documentation.
        The features, workflows, and UI described here are subject to change before the final release.
        :::

        Create a pass in Revolut Wallet in any supported format — `revpass` (Revolut's native
        semantic model: typed semantics, or a generic field dictionary with an optional
        presentation layout), `pkpass_base64`, `pkpass_url`, or
        `walletobjects_json`. Returns the Revolut-assigned pass `id`.

        Set `partner_reference` to your own key for the pass. Revolut uses it when it polls you for
        updates. Use the returned `id` to push updates (`PUT /passes/{id}`). Re-using a
        `partner_reference` that already exists returns `409`.

        :::info
        See [Create a pass](https://developer.revolut.com/docs/guides/revolut-wallet/operations/create-pass) for a step-by-step walkthrough.
        :::
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassCreateEnvelope'
            examples:
              boarding_pass_revolut:
                summary: A boarding pass (Revolut native format)
                value:
                  format: revpass
                  partner_reference: skyjet-2241-R7K92M
                  version: 1
                  template_id: tmpl_skyjet_boarding
                  rev_pass:
                    type: boarding_pass
                    relevant_at: '2026-08-02T06:15:00.000Z'
                    semantics:
                      passenger:
                        full_name: Ada Shannon
                      flight:
                        flight_number: '2241'
                        carrier_code: SJ
                        departure_airport:
                          iata: LTN
                          terminal: '1'
                        arrival_airport:
                          iata: OTP
                        scheduled_departure_at: '2026-08-02T06:15:00.000Z'
                        scheduled_arrival_at: '2026-08-02T09:40:00.000Z'
                      boarding:
                        gate: B22
                        seat: 14C
                        boarding_at: '2026-08-02T05:30:00.000Z'
                      booking:
                        pnr: R7K92M
              event_pass_revolut:
                summary: An event pass (Revolut native format)
                value:
                  format: revpass
                  partner_reference: acmeconcerts-bluelights-0001
                  version: 1
                  template_id: tmpl_acmeconcerts_event
                  rev_pass:
                    type: event_pass
                    relevant_at: '2026-09-15T19:00:00.000Z'
                    semantics:
                      event:
                        name: 'The Blue Lights: Live'
                        category: concert
                        held_on: '2026-09-15'
                        starts_at: '2026-09-15T19:00:00.000Z'
                        ends_at: '2026-09-15T22:00:00.000Z'
                        doors_open_at: '2026-09-15T18:00:00.000Z'
                      venue:
                        name: Grand Arena
                        city: London
                        country_code: GB
                        coordinates:
                          lat: 51.556
                          lng: -0.2796
                        section: Block 112
                        row: J
                        seat: '23'
                      ticket:
                        number: AM2026-0001
                        booking_reference: LM-8842
                        type: seated
                      participant:
                        full_name: Grace Turing
                      organiser:
                        name: Acme Concerts
                      validity:
                        valid_from: '2026-09-15T18:00:00.000Z'
                        valid_until: '2026-09-15T22:00:00.000Z'
              loyalty_pass_revolut:
                summary: A loyalty pass (Revolut native format)
                value:
                  format: revpass
                  partner_reference: brightpoints-9988776655
                  version: 1
                  template_id: tmpl_brightpoints_loyalty
                  rev_pass:
                    type: loyalty_pass
                    semantics:
                      member:
                        full_name: Alan Maxwell
                        member_id: '9988776655'
                        member_since_on: '2024-04-12'
                      loyalty:
                        program_name: BrightPoints
                        tier: Gold
                        tier_progress:
                          current: '3200'
                          target: '5000'
                          unit: points
                        points_balance:
                          value: '4820'
                          unit: points
                        next_reward:
                          description: Free coffee voucher
                          points_required: '5000'
                      validity:
                        valid_from: '2024-04-12T00:00:00.000Z'
              generic_pass:
                summary: A generic pass with a positional presentation
                value:
                  format: revpass
                  partner_reference: acme-events-badge-0001
                  version: 1
                  template_id: tmpl_acme_events_generic
                  rev_pass:
                    type: generic_pass
                    fields:
                      - id: attendee_name
                        label:
                          default: Attendee
                        value:
                          default: James Hamming
                        data_category: identity
                        semantic_type: participant.full_name
                        importance: 5
                      - id: access_status
                        label:
                          default: Access
                        value:
                          default: VIP access
                        data_category: status
                        importance: 4
                      - id: ticket_number
                        label:
                          default: Ticket number
                        value:
                          default: AM2026-0001
                        data_category: verification
                        importance: 4
                      - id: event_starts_at
                        label:
                          default: Starts at
                        value:
                          default: '2026-09-15T19:00:00.000Z'
                        data_type: date_time
                        data_category: time
                        date_style: medium
                        time_style: short
                        importance: 3
                      - id: terms_conditions
                        label:
                          default: Terms and conditions
                        value:
                          default: Entry is subject to the event terms and conditions.
                        data_category: governance
                        importance: 1
                    presentation:
                      positional:
                        primary:
                          items:
                            - field_id: attendee_name
                              alignment: full
                        secondary:
                          - items:
                              - field_id: access_status
                                alignment: start
                              - field_id: ticket_number
                                alignment: end
                        footer:
                          items:
                            - field_id: event_starts_at
                              alignment: start
                            - field_id: terms_conditions
                              alignment: end
                    branding:
                      brand_name: Acme Events
                      logo:
                        data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
                        format: image/png
                      background_image:
                        data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
                        format: image/png
                      predefined_style: material
                    issuer:
                      issuer_id: 3f9a1c2e-8b7d-4e6a-9f10-2c3b4d5e6f70
                      issuer_full_name: Acme Events Ltd
                      issuer_display_name: Acme Events
              generic_pass_semantic_fallback:
                summary: A generic pass using semantic fallback
                value:
                  format: revpass
                  partner_reference: acme-events-semantic-0001
                  version: 1
                  template_id: tmpl_acme_events_semantic
                  rev_pass:
                    type: generic_pass
                    fields:
                      - id: attendee_name
                        label:
                          default: Attendee
                        value:
                          default: Leonhard Nyquist
                        data_category: identity
                        semantic_type: participant.full_name
                        importance: 5
                      - id: ticket_number
                        label:
                          default: Ticket number
                        value:
                          default: AM2026-0001
                        data_category: verification
                        semantic_type: ticket.number
                        importance: 4
                      - id: event_starts_at
                        label:
                          default: Starts at
                        value:
                          default: '2026-09-15T19:00:00.000Z'
                        data_type: date_time
                        data_category: time
                        semantic_type: event.starts_at
              generic_pass_header:
                summary: A generic pass with a header row
                value:
                  format: revpass
                  partner_reference: acme-events-header-0001
                  version: 1
                  template_id: tmpl_acme_events_generic
                  rev_pass:
                    type: generic_pass
                    fields:
                      - id: event_title
                        label:
                          default: Event
                        value:
                          default: Acme Future Festival
                        data_category: identity
                        semantic_type: event.name
                        importance: 5
                      - id: attendee_name
                        label:
                          default: Attendee
                        value:
                          default: Marie Ritchie
                        data_category: identity
                        semantic_type: participant.full_name
                      - id: ticket_number
                        label:
                          default: Ticket number
                        value:
                          default: AM2026-0001
                        data_category: verification
                        semantic_type: ticket.number
                      - id: event_starts_at
                        label:
                          default: Starts at
                        value:
                          default: '2026-09-15T19:00:00.000Z'
                        data_type: date_time
                        data_category: time
                        semantic_type: event.starts_at
                    presentation:
                      positional:
                        header:
                          items:
                            - field_id: event_title
                              alignment: full
                        primary:
                          items:
                            - field_id: attendee_name
                              alignment: full
                        secondary:
                          - items:
                              - field_id: ticket_number
                                alignment: full
                        footer:
                          items:
                            - field_id: event_starts_at
                              alignment: full
              boarding_pass_pkpass_base64:
                summary: A boarding pass imported from a pkpass file (base64)
                value:
                  format: pkpass_base64
                  partner_reference: skyjet-2241-R7K92M
                  version: 1
                  pkpass: UEsDBAoAAAAAAGhVmVQAAAAAAAAAAAAAAAAJAAAA...
              boarding_pass_pkpass_url:
                summary: A boarding pass imported from a pkpass file (URL)
                value:
                  format: pkpass_url
                  partner_reference: skyjet-2241-R7K92M
                  version: 1
                  pkpass_url: https://partner.example/passes/skyjet-2241.pkpass
              loyalty_pass_walletobjects_json:
                summary: A loyalty pass imported from Wallet Objects JSON
                value:
                  format: walletobjects_json
                  partner_reference: brightpoints-9988776655
                  version: 1
                  template_id: tmpl_brightpoints_loyalty
                  walletobjects:
                    type: loyalty
                    class:
                      id: 1234567890123456789.brightpoints_loyalty
                      issuerName: BrightPoints
                      programName: BrightPoints Rewards
                      programLogo:
                        sourceUri:
                          uri: https://example.com/brightpoints-logo.png
                      reviewStatus: APPROVED
                    object:
                      id: 1234567890123456789.member_9988776655
                      classId: 1234567890123456789.brightpoints_loyalty
                      state: ACTIVE
                      barcode:
                        type: QR_CODE
